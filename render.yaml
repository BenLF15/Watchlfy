# Render Blueprint – ein Node-Web-Service + Postgres.
# Trakt-Sync (alle 30 Min.) und TMDB-Nachladen laufen IN der App, ein separater Cron-Job ist nicht nötig.
databases:
  - name: watchlfy-db
    # Free-Postgres wird von Render nach 30 Tagen gelöscht → für dauerhafte Historie basic-256mb.
    plan: free
    region: frankfurt
    databaseName: watchlfy
    user: watchlfy
    postgresMajorVersion: "16"

services:
  - type: web
    name: watchlfy
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: watchlfy-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: TRAKT_CLIENT_ID
        sync: false
      - key: TRAKT_CLIENT_SECRET
        sync: false
      - key: TIMEZONE
        value: Europe/Berlin
      - key: OPERATOR_NAME
        sync: false
      - key: OPERATOR_ADDRESS
        sync: false
      - key: OPERATOR_EMAIL
        sync: false
