<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07080f" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="view-transition" content="same-origin" />
  <link rel="manifest" href="/assets/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Watchlfy" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32" />
  <title>Watchlfy</title>
  <script src="/assets/theme.js?v=20261115d"></script>
  <script src="/assets/i18n.js?v=20261115d"></script>
  <link rel="stylesheet" href="/assets/watchlfy.css?v=20261115d" />
  <script src="/assets/changelog.js?v=20261115d" defer></script>
  <script src="/vendor/chart.umd.min.js" defer></script>
  <script src="/app.js?v=20261115d" defer></script>
  <script src="/assets/extras.js?v=20261115d" defer></script>
  <script src="/assets/collection.js?v=20261115d" defer></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="aria.skip">Zum Inhalt</a>
  <div class="power-on" id="leader" hidden aria-hidden="true"><i></i></div>
  <div class="horizon" aria-hidden="true"></div>
  <div class="osd-zap" id="osd-zap" aria-hidden="true" hidden><b id="osd-ch"></b><span id="osd-name"></span></div>

  <!-- Kopfzeile: Marke, Import, Profil -->
  <header class="topbar" id="appbar">
    <a class="brand" href="/" data-goto="overview" data-i18n-attr="aria-label:aria.toOverview">
      <img class="brand-logo" src="/assets/logo-animated.svg" alt="" width="40" height="40" />
      <span class="brand-word">Watchlfy</span>
    </a>
    <div class="topbar-actions">
      <button id="import-open" class="btn btn-rec" type="button">
        <i class="rec-dot" aria-hidden="true"></i><span data-i18n="btn.import">Importieren</span>
      </button>
      <button id="profile-btn" class="profile-btn" type="button" data-i18n-attr="aria-label:aria.openProfile;title:aria.openProfile">
        <span class="sp-avatar"><img id="avatar" alt="" hidden /><span id="avatar-initials" aria-hidden="true"></span></span>
        <span class="sp-text"><b id="user-line"></b></span>
      </button>
    </div>
  </header>

  <!-- Fernbedienung (Desktop): jede Taste ist ein Kanal, Ziffern 1–9 schalten um -->
  <aside class="remote" id="remote">
    <span class="remote-ir" aria-hidden="true"></span>
    <nav class="remote-keys" id="panel-tabs" role="tablist" data-i18n-attr="aria-label:nav.main">
      <button role="tab" data-panel="overview" data-ch="1"><kbd aria-hidden="true">1</kbd><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z"/><path d="M8 21h8M9 3l3 3 3-3"/></svg><span data-i18n="nav.overview"></span></button>
      <button role="tab" data-panel="top" data-ch="2"><kbd aria-hidden="true">2</kbd><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V11h4v10M10 21V4h4v17M15 21v-7h4v7"/></svg><span data-i18n="nav.top"></span></button>
      <button role="tab" data-panel="times" data-ch="3"><kbd aria-hidden="true">3</kbd><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span data-i18n="nav.times"></span></button>
      <button role="tab" data-panel="progress" data-ch="4"><kbd aria-hidden="true">4</kbd><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h2v-3H3zM7 17h2V11H7zM11 17h2V8h-2zM15 17h2V5h-2zM19 17h2V3h-2z"/></svg><span data-i18n="nav.progress"></span></button>
      <button role="tab" data-panel="history" data-ch="5"><kbd aria-hidden="true">5</kbd><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/><path d="M12 8v4l3 2"/></svg><span data-i18n="nav.history"></span></button>
      <button role="tab" data-panel="wrapped" data-ch="6"><kbd aria-hidden="true">6</kbd><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="1"/><circle cx="8.5" cy="12" r="2.2"/><circle cx="15.5" cy="12" r="2.2"/><path d="M8.5 14.2h7"/></svg><span data-i18n="nav.wrapped"></span></button>
      <button role="tab" data-panel="friends" data-ch="7"><kbd aria-hidden="true">7</kbd><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 4.9"/></svg><span data-i18n="nav.friends"></span></button>
      <button role="tab" data-panel="collection" data-ch="8"><kbd aria-hidden="true">8</kbd><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16"/><rect x="10" y="4" width="5" height="16"/><path d="m17 5 3.5 1-3.5 14"/></svg><span data-i18n="nav.collection"></span></button>
      <button role="tab" data-panel="admin" data-ch="0" id="admin-tab" hidden><kbd aria-hidden="true">0</kbd><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8.2 8 9 4.6-.8 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span data-i18n="nav.admin"></span></button>
    </nav>
    <span class="remote-brand" aria-hidden="true">WATCHLFY</span>
  </aside>

  <!-- Handy: Zapper unten – Kanal zurück, Programmführer, Kanal weiter -->
  <nav class="zapper" id="zapper" data-i18n-attr="aria-label:nav.main">
    <button type="button" class="zap-btn" data-zap="-1" data-i18n-attr="aria-label:nav.prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
    <button type="button" class="zap-display" id="zap-display" aria-haspopup="dialog">
      <b class="zap-ch" id="zap-ch">01</b><span class="zap-name" id="zap-name"></span><small data-i18n="nav.guide">Programm</small>
    </button>
    <button type="button" class="zap-btn" data-zap="1" data-i18n-attr="aria-label:nav.next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
  </nav>
  <dialog id="guide" class="dialog guide" aria-labelledby="guide-title">
    <header class="guide-head"><h2 id="guide-title" data-i18n="nav.guide">Programm</h2><span class="guide-clock" id="guide-clock"></span></header>
    <div class="guide-list" id="guide-list"></div>
  </dialog>

  <main class="container" id="main">
    <header class="page-head" id="page-head">
      <div class="page-titles"><p class="page-kicker" id="page-kicker"></p><h1 class="page-title" id="page-title"></h1></div>
      <div class="range-bar" id="range-bar">
        <div class="segmented small" id="range-control" role="tablist" data-i18n-attr="aria-label:aria.range">
          <button role="tab" data-range="7d" data-i18n="range.7d"></button>
          <button role="tab" data-range="30d" data-i18n="range.30d"></button>
          <button role="tab" data-range="90d" data-i18n="range.90d"></button>
          <button role="tab" data-range="365d" data-i18n="range.365d"></button>
          <button role="tab" data-range="all" data-i18n="range.all"></button>
        </div>
      </div>
    </header>
    <section class="hero" id="hero" hidden aria-roledescription="carousel" data-i18n-attr="aria-label:hero.label"></section>
    <section id="privacy-banner" class="notice" hidden>
      <span class="notice-icon" aria-hidden="true">🔒</span>
      <div class="notice-text"><strong data-i18n="privacy.bannerTitle"></strong><p class="muted small" data-i18n="privacy.bannerText"></p></div>
      <div class="notice-actions">
        <a class="btn btn-ghost btn-xs" href="/datenschutz" target="_blank" rel="noopener" data-i18n="privacy.read"></a>
        <button class="btn btn-primary btn-xs" type="button" id="privacy-accept" data-i18n="privacy.accept"></button>
      </div>
    </section>
    <section id="tmdb-banner" class="notice" hidden></section>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div class="now-playing" id="now-playing" hidden></div>

    <!-- ================================================= Noch keine Daten -->
    <div class="view" id="view-empty" hidden>
      <section class="card connect-card">
        <img src="/assets/logo-animated.svg" alt="" width="84" height="84" class="connect-logo" />
        <h2 data-i18n="empty.title"></h2>
        <p data-i18n="empty.text"></p>
        <div class="service-grid" id="empty-services"></div>
        <p class="hint" data-i18n="empty.hint"></p>
      </section>
    </div>

    <div class="view" id="view-stats" hidden>

      <!-- ================================================= Übersicht -->
      <section class="panel" data-panel="overview">
        <div class="fest-ribbon" id="fest-ribbon" hidden></div>
        <div class="wrapped-promo" id="wrapped-promo" hidden></div>
        <div class="kpis tickets">
          <article data-no="001" class="kpi kpi-hero">
            <span class="kpi-label" data-i18n="kpi.watchtime"></span>
            <strong class="kpi-value" data-kpi="hours">–</strong>
            <span class="kpi-sub" data-kpi-sub="hours"></span>
            <svg class="sparkline" id="sparkline" viewBox="0 0 120 32" preserveAspectRatio="none" aria-hidden="true"></svg>
          </article>
          <article data-no="002" class="kpi"><span class="kpi-label" data-i18n="kpi.avg"></span><strong class="kpi-value" data-kpi="avg">–</strong><span class="kpi-sub" data-i18n="kpi.minPerDay"></span></article>
          <article data-no="003" class="kpi"><span class="kpi-label" data-i18n="kpi.episodes"></span><strong class="kpi-value" data-kpi="episodes">–</strong><span class="kpi-sub" data-kpi-sub="series"></span></article>
          <article data-no="004" class="kpi"><span class="kpi-label" data-i18n="kpi.movies"></span><strong class="kpi-value" data-kpi="movies">–</strong><span class="kpi-sub" data-i18n="kpi.different"></span></article>
          <article data-no="005" class="kpi"><span class="kpi-label" data-i18n="kpi.series"></span><strong class="kpi-value" data-kpi="series">–</strong><span class="kpi-sub" data-kpi-sub="activeDays"></span></article>
        </div>
        <div class="insights" id="insights"></div>

        <section class="rail" id="continue-card" hidden>
          <header class="rail-head"><h2 data-i18n="continue.title"></h2><button class="link-btn" data-goto="progress" data-i18n="link.showAll"></button></header>
          <div class="rail-track wide" id="continue-row"></div>
        </section>
        <section class="rail">
          <header class="rail-head"><h2 data-i18n="overview.topSeries" data-fest-title></h2><button class="link-btn" data-goto="top" data-top-kind="series" data-i18n="link.showAll"></button></header>
          <div class="rail-track top10" id="overview-series"></div>
        </section>
        <section class="rail">
          <header class="rail-head"><h2 data-i18n="overview.topMovies"></h2><button class="link-btn" data-goto="top" data-top-kind="movies" data-i18n="link.showAll"></button></header>
          <div class="rail-track" id="overview-movies"></div>
        </section>

        <div class="grid-2">
          <section class="card">
            <header class="card-head"><div><h2 data-i18n="kpi.watchtime"></h2><p class="muted small" id="timeline-caption"></p></div></header>
            <div class="chart-wrap"><canvas id="timeline-chart" role="img" data-i18n-attr="aria-label:kpi.watchtime"></canvas></div>
          </section>
          <section class="card">
            <header class="card-head"><div><h2 data-i18n="services.title"></h2><p class="muted small" data-i18n="services.sub"></p></div></header>
            <div class="service-split" id="service-split"></div>
          </section>
        </div>
        <section class="card" id="collection-teaser" hidden></section>
      </section>

      <!-- ================================================= Top-Listen -->
      <section class="panel" data-panel="top" hidden>
        <section class="card">
          <header class="card-head wrap">
            <div><h2 id="top-title"></h2><p class="muted small" id="top-sub"></p></div>
            <div class="segmented small" id="top-kind" role="tablist">
              <button role="tab" data-kind="series" data-i18n="top.series"></button>
              <button role="tab" data-kind="movies" data-i18n="top.movies"></button>
              <button role="tab" data-kind="genres" data-i18n="top.genres"></button>
              <button role="tab" data-kind="actors" data-i18n="top.actors"></button>
              <button role="tab" data-kind="countries" data-i18n="top.countries"></button>
            </div>
          </header>
          <div class="podium" id="podium"></div>
          <ol class="rank-bars" id="top-list" start="4"></ol>
        </section>
      </section>

      <!-- ================================================= Schauzeiten -->
      <section class="panel" data-panel="times" hidden>
        <div class="insights" id="time-insights"></div>
        <section class="card">
          <header class="card-head"><div><h2 data-i18n="times.title" data-fest-title></h2><p class="muted small" id="times-sub"></p></div></header>
          <div class="heatmap" id="heatmap" role="grid" data-i18n-attr="aria-label:times.title"></div>
          <div class="heat-legend"><span class="muted small" data-i18n="times.less"></span><span class="heat-scale"></span><span class="muted small" data-i18n="times.more"></span></div>
          <div class="heat-tip" id="heat-tip" hidden></div>
        </section>
        <div class="grid-2">
          <section class="card">
            <header class="card-head"><div><h2 data-i18n="times.byHour"></h2><p class="muted small" data-i18n="times.byHourSub"></p></div></header>
            <div class="chart-wrap short"><canvas id="hours-chart" role="img" data-i18n-attr="aria-label:times.byHourSub"></canvas></div>
          </section>
          <section class="card">
            <header class="card-head"><div><h2 data-i18n="times.byDay"></h2><p class="muted small" data-i18n="times.byDaySub"></p></div></header>
            <div class="chart-wrap short"><canvas id="weekday-chart" role="img" data-i18n-attr="aria-label:times.byDaySub"></canvas></div>
          </section>
        </div>
        <section class="card">
          <header class="card-head"><div><h2 data-i18n="binge.title"></h2><p class="muted small" data-i18n="binge.sub"></p></div></header>
          <ul class="binge-list" id="binge-list"></ul>
        </section>
      </section>

      <!-- ================================================= Fortschritt -->
      <section class="panel" data-panel="progress" hidden>
        <section class="card">
          <header class="card-head"><div><h2 data-i18n="continue.title"></h2><p class="muted small" data-i18n="continue.sub"></p></div></header>
          <div class="poster-row" id="progress-continue"></div>
        </section>
        <section class="card">
          <header class="card-head wrap">
            <div><h2 data-i18n="progress.title"></h2><p class="muted small" data-i18n="progress.sub"></p></div>
            <div class="segmented small" id="progress-filter">
              <button data-filter="all" data-i18n="progress.all"></button>
              <button data-filter="open" data-i18n="progress.open"></button>
              <button data-filter="done" data-i18n="progress.done"></button>
            </div>
          </header>
          <ul class="progress-list" id="progress-list"></ul>
        </section>
      </section>

      <!-- ================================================= Verlauf -->
      <section class="panel" data-panel="history" hidden>
        <section class="card search-card">
          <label class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
            <input id="search-input" type="search" autocomplete="off" spellcheck="false" maxlength="80" data-i18n-attr="placeholder:search.placeholder;aria-label:search.placeholder" />
          </label>
        </section>
        <div class="history" id="history"></div>
        <button class="btn btn-ghost history-more" id="history-more" type="button" hidden data-i18n="history.more"></button>
      </section>

      <!-- ================================================= Rückblick -->
      <section class="panel" data-panel="wrapped" hidden><div id="wrapped"></div></section>

      <!-- ================================================= Freunde -->
      <section class="panel" data-panel="friends" hidden>
        <section class="card">
          <header class="card-head"><div><h2 data-i18n="friends.title"></h2><p class="muted small" data-i18n="friends.sub"></p></div></header>
          <form class="friend-add" id="friend-form" novalidate>
            <input id="friend-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="24" data-i18n-attr="placeholder:friends.placeholder;aria-label:friends.placeholder" />
            <button class="btn btn-primary" type="submit" data-i18n="friends.add"></button>
          </form>
          <div id="friend-requests"></div>
          <ul class="friend-list" id="friend-list"></ul>
        </section>
        <div id="compare"></div>
      </section>

      <!-- ================================================= Sammlung -->
      <section class="panel" data-panel="collection" hidden><div id="collection"></div></section>
    </div>

    <!-- ================================================= Profil -->
    <div class="view" id="view-profile" hidden>
      <section class="card profile-head">
        <button type="button" class="profile-avatar" id="profile-avatar"></button>
        <input type="file" id="avatar-file" accept="image/*" hidden />
        <input type="file" id="avatar-camera" accept="image/*" capture="user" hidden />
        <div class="profile-who">
          <h2 id="profile-name"></h2>
          <p class="muted small" id="profile-sub"></p>
          <div class="avatar-actions"><button type="button" class="link-btn" id="avatar-change" data-i18n="avatar.change"></button><button type="button" class="link-btn danger" id="avatar-remove" hidden data-i18n="avatar.remove"></button></div>
        </div>
      </section>

      <section class="card">
        <header class="card-head"><div><h2 data-i18n="sources.title"></h2><p class="muted small" data-i18n="sources.sub"></p></div></header>
        <div class="service-grid" id="profile-services"></div>
        <ul class="import-history" id="import-history"></ul>
      </section>

      <section class="card" id="trakt-card">
        <header class="card-head"><div><h2>Trakt.tv</h2><p class="muted small" data-i18n="trakt.sub"></p></div></header>
        <div id="trakt-body"></div>
      </section>

      <section class="card" id="review-card">
        <header class="card-head"><div><h2 data-i18n="review.title"></h2><p class="muted small" data-i18n="review.sub"></p></div></header>
        <div id="review-body"></div>
      </section>

      <section class="card">
        <header class="card-head"><div><h2 data-i18n="settings.title"></h2><p class="muted small" data-i18n="settings.sub"></p></div></header>
        <h3 class="settings-label" data-i18n="settings.appearance"></h3>
        <div class="theme-picker" id="theme-picker" role="radiogroup" data-i18n-attr="aria-label:settings.appearance">
          <button type="button" role="radio" data-theme-mode="system"><span class="tp-swatch tp-system"></span><span data-i18n="theme.system"></span></button>
          <button type="button" role="radio" data-theme-mode="light"><span class="tp-swatch tp-light"></span><span data-i18n="theme.light"></span></button>
          <button type="button" role="radio" data-theme-mode="dark"><span class="tp-swatch tp-dark"></span><span data-i18n="theme.dark"></span></button>
          <button type="button" role="radio" data-theme-mode="season"><span class="tp-swatch tp-season"></span><span data-i18n="theme.season"></span></button>
        </div>
        <p class="muted small theme-hint" id="theme-hint"></p>
        <div class="settings-row">
          <div><h3 class="settings-label" data-i18n="settings.glass"></h3><p class="muted small" data-i18n="settings.glassHint"></p></div>
          <button type="button" class="switch" id="glass-switch" role="switch" aria-checked="false" data-i18n-attr="aria-label:settings.glass"><span class="switch-knob"></span></button>
        </div>
        <div class="settings-row">
          <div><h3 class="settings-label" data-i18n="settings.festive"></h3><p class="muted small" data-i18n="settings.festiveHint"></p><p class="muted small" id="festive-hint"></p></div>
          <button type="button" class="switch" id="festive-switch" role="switch" aria-checked="true" data-i18n-attr="aria-label:settings.festive"><span class="switch-knob"></span></button>
        </div>
        <div class="settings-row">
          <div><h3 class="settings-label" data-i18n="settings.language"></h3></div>
          <div class="lang-picker" id="lang-picker" role="radiogroup" data-i18n-attr="aria-label:settings.language"></div>
        </div>
      </section>

      <section class="card">
        <header class="card-head"><div><h2 data-i18n="account.title"></h2><p class="muted small" data-i18n="account.sub"></p></div></header>
        <dl class="sys-list" id="profile-account"></dl>
        <div class="birthday-row">
          <label class="season-date"><span class="muted small" data-i18n="account.birthday"></span><input type="date" id="birthday-input" max="2100-12-31" /></label>
          <button type="button" class="btn btn-ghost btn-xs" id="birthday-save" data-i18n="btn.save"></button>
          <button type="button" class="btn btn-ghost btn-xs" id="birthday-clear" data-i18n="btn.remove"></button>
        </div>
        <div class="profile-actions">
          <button class="btn btn-ghost" data-action="password" type="button" data-i18n="btn.password"></button>
          <a class="btn btn-ghost" href="/api/me/export" download>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14" /></svg>
            <span data-i18n="btn.export"></span>
          </a>
          <button class="btn btn-ghost" type="button" id="news-open" data-i18n="news.open"></button>
          <form method="post" action="/logout">
            <button class="btn btn-ghost" type="submit">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10" /></svg>
              <span data-i18n="btn.logout"></span>
            </button>
          </form>
          <button class="btn btn-ghost btn-danger" data-action="delete" type="button" data-i18n="btn.deleteAccount"></button>
        </div>
      </section>
    </div>

    <!-- ================================================= Admin -->
    <div class="view" id="view-admin" hidden>
      <section class="admin-stats" id="admin-stats"></section>
      <section class="card">
        <header class="card-head"><div><h2 data-i18n="admin.tester"></h2><p class="muted small" data-i18n="admin.testerSub"></p></div></header>
        <div class="season-tester">
          <label class="season-date"><span class="muted small" data-i18n="admin.date"></span><input type="date" id="season-date" /></label>
          <div class="season-quick" id="event-quick"></div>
          <button type="button" class="btn btn-ghost btn-xs" id="season-reset" data-i18n="admin.today"></button>
        </div>
        <p class="muted small theme-hint" id="season-status"></p>
      </section>
      <section class="card">
        <header class="card-head">
          <div><h2 data-i18n="admin.accounts"></h2><p class="muted small" data-i18n="admin.accountsSub"></p></div>
          <div class="head-controls"><a class="btn btn-ghost" href="/api/admin/accounts.csv" download data-i18n="admin.csv"></a></div>
        </header>
        <ul class="user-list" id="admin-users"></ul>
      </section>
      <div class="grid-2">
        <section class="card">
          <header class="card-head"><div><h2 data-i18n="admin.lastLogins"></h2></div></header>
          <ul class="login-log" id="admin-logins"></ul>
        </section>
        <div class="stack">
          <section class="card">
            <header class="card-head"><div><h2 data-i18n="admin.system"></h2></div></header>
            <dl class="sys-list" id="admin-system"></dl>
          </section>
          <section class="card">
            <header class="card-head"><div><h2 data-i18n="admin.syncErrors"></h2></div></header>
            <ul class="login-log" id="admin-errors"></ul>
          </section>
        </div>
      </div>
      <section class="card">
        <div class="settings-row">
          <div><h2 data-i18n="shop.freeTitle"></h2><p class="muted small" data-i18n="shop.freeText"></p></div>
          <button type="button" class="switch" id="free-shop-switch" role="switch" aria-checked="false" data-i18n-attr="aria-label:shop.freeTitle"><span class="switch-knob"></span></button>
        </div>
      </section>
      <section class="card">
        <header class="card-head"><div><h2 data-i18n="backup.title"></h2><p class="muted small" data-i18n="backup.sub"></p></div></header>
        <p class="backup-status" id="backup-status"></p>
        <p class="muted small" data-i18n="backup.warning"></p>
        <div class="profile-actions">
          <a class="btn btn-primary" id="backup-download" href="/api/admin/backup" download>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14" /></svg>
            <span data-i18n="backup.download"></span>
          </a>
          <label class="btn btn-ghost">
            <input type="file" id="restore-file" accept=".gz,.json,application/gzip,application/json" hidden />
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V9m0 0-4 4m4-4 4 4M5 4h14" /></svg>
            <span data-i18n="backup.restore"></span>
          </label>
        </div>
        <ul class="import-log" id="restore-log"></ul>
      </section>
    </div>
    <footer class="app-footer">
      <a href="/datenschutz" target="_blank" rel="noopener" data-i18n="legal.privacy"></a>
      <span class="muted small" data-i18n="legal.tmdb"></span>
    </footer>
  </main>

  <div class="fx-layer" id="fx-layer" aria-hidden="true"></div>
  <dialog id="import-dialog" class="dialog import-dlg" aria-labelledby="import-title"><div class="dialog-inner" id="import-body"></div></dialog>
  <dialog id="detail-dialog" class="dialog detail" aria-labelledby="detail-title"><div class="detail-inner" id="detail-body"></div></dialog>
  <dialog id="correct-dialog" class="dialog" aria-labelledby="correct-title"><div class="dialog-inner" id="correct-body"></div></dialog>
  <dialog id="avatar-menu" class="dialog avatar-menu" aria-labelledby="avatar-menu-title"><div class="dialog-inner" id="avatar-menu-body"></div></dialog>
  <dialog id="avatar-dialog" class="dialog avatar-dlg" aria-labelledby="avatar-title">
    <div class="dialog-inner">
      <button type="button" class="tour-close" data-close-dialog data-i18n-attr="aria-label:btn.close">✕</button>
      <h2 id="avatar-title" data-i18n="avatar.title"></h2>
      <p class="muted small" data-i18n="avatar.hint"></p>
      <div class="avatar-crop"><canvas id="avatar-canvas" width="560" height="560"></canvas></div>
      <label class="avatar-zoom"><span aria-hidden="true">−</span><input type="range" id="avatar-zoom" min="1" max="4" step="0.01" value="1" data-i18n-attr="aria-label:avatar.zoom" /><span aria-hidden="true">＋</span></label>
      <div class="avatar-btns"><button type="button" class="btn btn-ghost" id="avatar-other" data-i18n="avatar.other"></button><button type="button" class="btn btn-primary" id="avatar-save" data-i18n="avatar.save"></button></div>
    </div>
  </dialog>
  <dialog id="news-dialog" class="dialog news" aria-labelledby="news-title"><div class="news-inner" id="news-body"></div></dialog>
  <dialog id="item-dialog" class="dialog item-dialog" aria-labelledby="item-title"><div class="dialog-inner" id="item-body"></div></dialog>
  <dialog id="gift-dialog" class="dialog gift-dialog" aria-labelledby="gift-title"><div class="dialog-inner" id="gift-body"></div></dialog>
  <div class="note-toast" id="note-toast" role="status" aria-live="polite" hidden></div>
  <dialog id="story" class="story" aria-labelledby="story-title"><div class="story-inner" id="story-body"></div></dialog>
</body>
</html>
